# Play-by-play wording bank -- Live Game Lab
#
# A content bank, not wired into the app yet (2026-08-17, a direct GM
# ask): "put into a TOML, so I can go through and edit/add my own
# stuff... if it's more efficient to pull it into the code, not a file,
# we can do that later after I've hand edited it." Edit/add/delete
# freely -- nothing here is load-bearing until someone wires it in.
#
# PLACEHOLDERS
#   {player}   -- the primary actor's tag, "#4 Kiln (PG DSM)"
#   {player2}  -- a second player's tag, for passes/assists (the
#                 receiver) -- same "#N Name (POS TEAM)" format
#   {team}     -- the acting team's abbreviation, e.g. "DSM"
#   {opponent} -- the other team's abbreviation, e.g. "KCY"
#
# Every phrase is a *complete sentence template*, not a trailing clause
# assuming a fixed "{player} " prefix -- some of the GM's own examples
# put the tag mid-sentence or use two tags (an inbound pass, an assist),
# which a fixed-prefix format can't express. `[perimeter_no_name]` is
# the one category with no {player}/{player2} at all -- team-level
# flavor, no specific player, so it gets no blip on the court either.
#
# POSITIONAL NOTES (2026-08-17, a direct GM ask -- only these two are
# meant as real constraints; nothing else in here needs positional
# gating: "I just want you doing what's already in the engine"):
#   - [tip_off]: must be a Center, or a PF if the team has no Center.
#   - [backcourt_bringup]: should usually be a PG (the "setting up a
#     play" ball-handler) -- a soft bias, not a hard rule.
#
# PACING NOTE (2026-08-17, a direct GM ask): [inbound_after_make]
# shouldn't fire after *every* basket -- "the game doesn't feel so
# stale by going basket-basket-basket-basket." A few times a quarter,
# or reliably after a big play (a 3, an and-1, a highlight), is the
# intent -- basket-basket-inbound-basket-otherfiller, not
# basket-inbound-basket-inbound. That's a selection-logic decision for
# whoever wires this in, not something encoded in the phrases below.

[tip_off]
# Position: C, or PF if no C.
phrases = [
  "{player} wins the tip for {team}.",
  "{player} controls the opening tip, and {team} has the ball first.",
  "{player} out-jumps her opposite number to start it off for {team}.",
  "{player} taps it cleanly back to a teammate -- {team} ball to open the quarter.",
]

[inbound_after_make]
# Not every possession -- see the pacing note above.
phrases = [
  "{player} inbounds the ball after the {opponent} score.",
  "{player} passes it in, looking to answer on offense.",
  "The ball is sent inbounds by {player}.",
  "After the {opponent} bucket, {player} bounces it in to {player2}.",
  "{player} takes the inbounds pass and starts {team} the other way.",
  "{player} steps out of bounds to put it back in play for {team}.",
  "Quick inbounds from {player} -- {team} wants to push the pace.",
  "{player} gets the ball in cleanly, {team} bringing it up.",
]

[inbound_after_deadball]
# After a foul, out-of-bounds, or other stoppage -- not a made basket.
phrases = [
  "{player} inbounds after the whistle.",
  "{team} takes it out of bounds, {player} handling the pass-in.",
  "{player} restarts things for {team} after the stoppage.",
  "The referee hands it to {player} to put back in play.",
  "{player} checks it in for {team}.",
]

[backcourt_bringup]
# Soft position bias: usually PG.
phrases = [
  "{player} dribbles at the top, surveying the defense.",
  "{player} brings the ball up, calling out the set.",
  "{player} walks it up, in no hurry to attack.",
  "{player} controls the tempo, easing into the frontcourt.",
  "{player} pushes it up the floor, scanning for an opening.",
  "{player} settles the offense into its spacing.",
]

[midcourt_advance]
phrases = [
  "{player} swings it ahead to {player2} crossing half-court.",
  "{player} finds {player2} streaking into the frontcourt.",
  "{player} flips it up the sideline to {player2}.",
  "{player} advances the ball to {player2} near midcourt.",
  "{player} hits {player2} in stride past half-court.",
]

[perimeter_no_name]
# Team-level flavor -- no {player}/{player2}, no blip on the court.
phrases = [
  "{team} works it around the perimeter, probing for an opening.",
  "{team} swings the ball side to side, patient on offense.",
  "{team} is content to let the shot clock run, looking for a good look.",
  "The ball moves crisply around {team}'s offense -- nothing there yet.",
  "{team} resets, running through their offense again.",
]

[clock_milking]
# Late-game, protecting a lead or just killing clock.
phrases = [
  "{player} slows it down, letting the clock bleed a little.",
  "{player} is in no rush -- {team} happy to eat the clock here.",
  "{player} holds it out top, content to wait.",
  "{player} controls the pace, {team} managing the clock.",
]

[foul_no_ft]
# A dead-ball foul that doesn't send anyone to the line (not in the
# bonus yet).
phrases = [
  "{player} picks up a foul away from the ball.",
  "{player} is whistled for a reach-in.",
  "A foul is called on {player} -- {team} not yet in the bonus.",
  "{player} gets tagged with a loose-ball foul.",
  "{player} gets a whistle for an over-the-back foul.",
]

