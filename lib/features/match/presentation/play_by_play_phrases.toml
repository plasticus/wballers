[free_throws]
# Only ever shown when clutch (under a minute, game within 3) -- see
# _isClutchFreeThrow in live_game_lab_screen.dart.
phrases = [
  "{player} steps to the line and hits both.",
  "{player} splits the pair at the line.",
  "{player} knocks down both free throws.",
  "{player} misses the first, makes the second at the line.",
  "{player} calmly sinks both from the stripe.",
]

[putback]
# A made shot right after an offensive rebound -- still a twopt_make
# for scoring purposes, just its own flavor bank.
phrases = [
  "{player} cleans up the putback.",
  "{player} taps the offensive rebound back in.",
  "{player} follows her own miss and scores.",
  "{player} out-works everyone for the putback bucket.",
  "{player} grabs the offensive board and scores right back up.",
]

