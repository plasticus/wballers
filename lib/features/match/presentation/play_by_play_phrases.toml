[and_one]
phrases = [
  "{player} scores through contact -- and-one!",
  "{player} finishes at the rim and draws the foul -- and-one chance!",
  "{player} powers it in with a body on her -- and-one!",
  "{player} absorbs the hit and still finishes -- and-one!",
  "{player} banks it home through contact -- and-one!",
