<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Women's Apex Hoops - Teams</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #1a1a2e;
    color: #eee;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { margin-top: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  a.team-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 16px;
    transition: border-color 0.15s;
  }
  a.team-card:hover { border-color: #e94560; }
  .swatch {
    width: 100%;
    height: 48px;
    border-radius: 4px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .team-name { font-weight: 600; font-size: 1.05rem; }
  .team-meta { color: #aaa; font-size: 0.85rem; margin-top: 4px; }
</style>
</head>
<body>
  <div style="margin-bottom: 16px;">
    <a href="index.html" style="color: #aaa; text-decoration: none; margin-right: 16px;">&larr; Home</a>
    <a href="player-edit.html" style="color: #aaa; text-decoration: none;">Player Editor</a>
  </div>
  <h1>Women's Apex Hoops</h1>
  <div id="grid" class="grid"></div>

  <script>
    const CACHE_BUST = '?_=' + Date.now();

    async function main() {
      const [teams, players] = await Promise.all([
        fetch('teams.json' + CACHE_BUST).then(r => r.json()),
        fetch('players.json' + CACHE_BUST).then(r => r.json())
      ]);

      const counts = {};
      for (const p of players) counts[p.team] = (counts[p.team] || 0) + 1;

      const grid = document.getElementById('grid');
      Object.entries(teams).forEach(([code, team]) => {
        const a = document.createElement('a');
        a.className = 'team-card';
        a.href = 'team.html?team=' + encodeURIComponent(code);

        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = team.color;

        const name = document.createElement('div');
        name.className = 'team-name';
        name.textContent = team.name;

        const meta = document.createElement('div');
        meta.className = 'team-meta';
        meta.textContent = `${code} - ${counts[code] || 0} on roster`;

        a.appendChild(swatch);
        a.appendChild(name);
        a.appendChild(meta);
        grid.appendChild(a);
      });
    }
    main().catch(err => console.error(err));
  </script>
</body>
</html>
