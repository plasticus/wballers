<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Women's Apex Hoops</title>
<script>window.BASE_SPRITE = 'BlankBaldwoman32.png';</script>
<script>document.write('<script src="render.js?_=' + Date.now() + '"><\/script>');</script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #1a1a2e;
    color: #eee;
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { margin-top: 0; }
  h2 {
    color: #aaa;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 32px 0 14px;
    border-bottom: 1px solid #0f3460;
    padding-bottom: 6px;
  }
  .spotlight {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 10px;
  }
  .spotlight-card {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .spotlight-card canvas {
    width: 100%;
    aspect-ratio: 1;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #bfd4e8;
    border-radius: 4px;
  }
  .spotlight-card .name { font-weight: 600; font-size: 0.9rem; margin-top: 8px; }
  .spotlight-card .meta { color: #aaa; font-size: 0.78rem; margin-top: 2px; }
  .reroll {
    margin-bottom: 24px;
  }
  button {
    padding: 10px 16px;
    border-radius: 4px;
    border: none;
    background: #e94560;
    color: #eee;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #ff6b81; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  a.team-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 16px;
    transition: border-color 0.15s;
  }
  a.team-card:hover { border-color: #e94560; }
  .swatch {
    width: 100%;
    height: 48px;
    border-radius: 4px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .team-name { font-weight: 600; font-size: 1.05rem; }
  .team-meta { color: #aaa; font-size: 0.85rem; margin-top: 4px; }
  .nav {
    margin-bottom: 20px;
  }
  .nav a {
    color: #aaa;
    text-decoration: none;
    margin-right: 16px;
  }
  .nav a:hover { color: #e94560; }
</style>
</head>
<body>
  <div class="nav">
    <a href="http://localhost:8000/mixer.html">Character Mixer</a>
    <a href="player-edit.html">Player Editor</a>
  </div>

  <h1>Women's Apex Hoops</h1>

  <h2>Player Spotlight</h2>
  <div class="reroll">
    <button id="rerollBtn">Re-roll spotlight</button>
  </div>
  <div class="spotlight" id="spotlight"></div>

  <h2>Teams</h2>
  <div id="grid" class="grid"></div>

  <script>
    const CACHE_BUST = '?_=' + Date.now();

    function shuffle(array, rng) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function renderSpotlight(players, teams) {
      const container = document.getElementById('spotlight');
      container.innerHTML = '';
      players.forEach(p => {
        const card = document.createElement('div');
        card.className = 'spotlight-card';

        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        card.appendChild(canvas);

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = p.name;
        card.appendChild(name);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const teamName = teams[p.team] ? teams[p.team].name : p.team;
        meta.textContent = `${p.position} — ${teamName}`;
        card.appendChild(meta);

        container.appendChild(card);

        const jerseyHex = teams[p.team] ? teams[p.team].color : null;
        drawFace(canvas, p.face, jerseyHex, p.position === 'coach').catch(err => console.error(p.name, err));
      });
    }

    function renderTeams(teams, players) {
      const counts = {};
      for (const p of players) counts[p.team] = (counts[p.team] || 0) + 1;

      const grid = document.getElementById('grid');
      Object.entries(teams).forEach(([code, team]) => {
        const a = document.createElement('a');
        a.className = 'team-card';
        a.href = 'team.html?team=' + encodeURIComponent(code);

        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = team.color;

        const name = document.createElement('div');
        name.className = 'team-name';
        name.textContent = team.name;

        const meta = document.createElement('div');
        meta.className = 'team-meta';
        meta.textContent = `${code} - ${counts[code] || 0} on roster`;

        a.appendChild(swatch);
        a.appendChild(name);
        a.appendChild(meta);
        grid.appendChild(a);
      });
    }

    async function main() {
      const [teams, players] = await Promise.all([
        fetch('teams.json' + CACHE_BUST).then(r => r.json()),
        fetch('players.json' + CACHE_BUST).then(r => r.json())
      ]);

      // Deterministic spotlight seeded by date so it stays stable through the day,
      // but re-roll button picks a new random set.
      const today = new Date().toDateString();
      let seed = 0;
      for (let i = 0; i < today.length; i++) seed += today.charCodeAt(i);
      let rngState = seed;
      const seededRng = () => {
        rngState = (rngState * 9301 + 49297) % 233280;
        return rngState / 233280;
      };

      let spotlight = shuffle(players, seededRng).slice(0, 5);
      renderSpotlight(spotlight, teams);
      renderTeams(teams, players);

      document.getElementById('rerollBtn').addEventListener('click', () => {
        rngState = Date.now();
        spotlight = shuffle(players, Math.random).slice(0, 5);
        renderSpotlight(spotlight, teams);
      });
    }

    main().catch(err => console.error(err));
  </script>
</body>
</html>
